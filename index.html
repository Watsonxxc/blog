            document.getElementById('el-contact-email').textContent = SITE_CONFIG.contact.email;
            document.getElementById('el-contact-email').href = "mailto:" + SITE_CONFIG.contact.email;

            // 渲染技能跑马灯

                `<span class="border-2 border-black px-2 py-1 font-bold bg-gray-100 hover:bg-black hover:text-white transition-colors">${s}</span>`

            // 渲染文章列表

            renderProjects();

        // 2. 渲染文章逻辑
        function renderPosts() {
            // 首页只取前2个
            const homePosts = SITE_CONFIG.posts.slice(0, 2);
            document.getElementById('el-home-posts').innerHTML = homePosts.map(post => createPostCard(post, true)).join('');

            // 全部文章
            document.getElementById('el-all-posts').innerHTML = SITE_CONFIG.posts.map(post => createPostCard(post, false)).join('');
        }

        // 创建文章卡片 HTML
        function createPostCard(post, isHome) {
            const bgClass = THEME.colors[post.color] || 'bg-white';
            // 首页卡片样式
            if (isHome) {
                return `
                <div onclick="openArticle(${post.id})" class="${bgClass} border-4 border-black p-6 shadow-hard hover-pop cursor-pointer h-full flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-4 border-b-2 border-black pb-2">
                            <span class="font-black bg-white border-2 border-black px-2 text-xs">${post.category}</span>
                            <span class="font-bold text-sm">${post.date}</span>
                        </div>
                        <h3 class="text-3xl font-black leading-tight mb-2">${post.title}</h3>
                        <p class="font-bold opacity-80 line-clamp-3">${post.summary}</p>
                    </div>
                    <div class="mt-4 text-right font-black underline decoration-4">READ MORE -></div>
                </div>`;
            }
            // 列表页卡片样式 (横向)
            return `
            <article onclick="openArticle(${post.id})" class="group bg-white border-4 border-black shadow-hard hover-pop cursor-pointer flex flex-col md:flex-row overflow-hidden min-h-[180px]">
                <div class="${bgClass} border-b-4 md:border-b-0 md:border-r-4 border-black p-6 flex items-center justify-center md:w-32 shrink-0">
                    <i data-lucide="file-text" class="w-10 h-10 text-black"></i>
                </div>
                <div class="p-6 flex-grow flex flex-col justify-center">
                    <div class="flex gap-2 mb-2 text-xs font-black text-gray-500">
                        <span>${post.date}</span> / <span>${post.category}</span>
                    </div>
                    <h3 class="text-2xl font-black mb-2 group-hover:text-p-pink transition-colors">${post.title}</h3>
                    <p class="font-bold text-gray-700">${post.summary}</p>
                </div>
            </article>`;
        }

        // 3. 打开文章详情 (核心功能)
        function openArticle(id) {
            const post = SITE_CONFIG.posts.find(p => p.id === id);
            if (!post) return;

            // 填充内容
            document.getElementById('art-cat').textContent = post.category;
            document.getElementById('art-date').textContent = post.date;
            document.getElementById('art-title').textContent = post.title;
            document.getElementById('art-content').innerHTML = post.content;

            // 切换视图
            switchPage('article-view');
        }

        // 4. 渲染项目
        function renderProjects() {
            document.getElementById('el-projects').innerHTML = SITE_CONFIG.projects.map(p => `
                <div class="bg-white border-4 border-black p-4 shadow-hard hover-pop group">
                    <div class="bg-black border-4 border-black h-48 mb-4 overflow-hidden relative">
                         <img src="${p.img}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-110 transition-all duration-500">
                         <div class="absolute top-2 right-2 bg-p-yellow border-2 border-black px-2 font-black text-xs">${p.tag}</div>
                    </div>
                    <h3 class="text-xl font-black mb-2 truncate">${p.title}</h3>
                    <p class="font-bold text-sm text-gray-600 mb-4 h-10 overflow-hidden">${p.desc}</p>
                    <a href="${p.link}" class="block w-full text-center bg-black text-white py-2 font-black hover:bg-p-cyan hover:text-black border-2 border-black transition-colors">查看 -></a>
                </div>
            `).join('');
        }

        // 页面切换路由
        function switchPage(pageId) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // 隐藏所有 section
            document.querySelectorAll('.page-section').forEach(el => {
                el.classList.remove('active');
            });
            
            // 延迟一点点显示，制造切换感
            setTimeout(() => {
                const target = document.getElementById(pageId);
                if (target) {
                    target.classList.add('active');
                    // 如果是文章列表页，重新渲染icon确保显示
                    if(pageId === 'logs') lucide.createIcons(); 
                }
            }, 50);
        }

        // 启动！
        window.onload = initSite;
    </script>
</body>
</html>
